<script>
        // チャート用カラーパレット (Kawaii & Clean パステル)
        const COLORS = ['#FF9CEE', '#B28DFF', '#6EB5FF', '#85E3FF', '#AFF8D8', '#E7FFAC', '#FFF5BA', '#FFABAB'];

        // カテゴリ別アイコンマップ
        const CATEGORY_ICONS = {
            '食費': '🍽️', '日用品': '🧴', '交通費': '🚃', '固定費': '🏠',
            '娯楽': '🎮', '医療': '🏥', '衣服': '👕', '教育': '📚',
            '通信費': '📱', '給与': '💼', '収入': '💰', '未分類': '📦'
        };

        // 現在表示している年月と設定情報を管理
        var currentYear = new Date().getFullYear();
        var currentMonth = new Date().getMonth(); // 0-11
        var currentSettings = { budget: 150000, categories: "食費,日用品,交通費,娯楽,医療,衣服,通信費", fixedExpenses: [] };
        var currentTab = 'home';
        var tabDataLoaded = { home: false, records: false, analysis: false };

        // GAS Web App API URL（build.js がビルド時に置換。GAS配信時は未置換のためテンプレートが注入した exec URL にフォールバック）
        var GAS_API_URL = '%%GAS_URL%%';
        if (GAS_API_URL.indexOf('%%') === 0) {
            var injectedUrl = window.__GAS_EXEC_URL || '';
            GAS_API_URL = (injectedUrl && injectedUrl.indexOf('<' + '?') !== 0) ? injectedUrl : '';
        }

        // sessionStorage キャッシュ
        function getCacheKey(action, year, month) {
            return 'kakeibo_' + action + '_' + year + '_' + month;
        }

        function getCache(key) {
            try {
                var cached = sessionStorage.getItem(key);
                if (cached) {
                    var parsed = JSON.parse(cached);
                    if (parsed.expiry > Date.now()) return parsed.data;
                    sessionStorage.removeItem(key);
                }
            } catch (e) { /* ignore */ }
            return null;
        }

        function setCache(key, data, ttlMs) {
            try {
                sessionStorage.setItem(key, JSON.stringify({ data: data, expiry: Date.now() + (ttlMs || 300000) }));
            } catch (e) { /* ignore */ }
        }

        function invalidateCache() {
            try {
                Object.keys(sessionStorage).forEach(function (key) {
                    if (key.indexOf('kakeibo_') === 0) sessionStorage.removeItem(key);
                });
            } catch (e) { /* ignore */ }
        }

        // API token 管理（localStorage 保存。GAS 側の API_TOKEN プロパティと照合される）
        // 入力を求めるのはサーバーが unauthorized を返したときだけ（通常時はプロンプトを出さない）
        // localStorage が使えない環境（ショートカットの一時Webビュー等）向けにメモリ上にも保持する
        var sessionToken = '';

        // URLフラグメント #token=xxx からトークンを受け取る（iOSショートカット等で毎回入力を省くため）
        // フラグメントはサーバーに送信されないため URL 埋め込みでも比較的安全
        (function () {
            try {
                var m = (window.location.hash || '').match(/[#&]token=([^&]+)/);
                if (m) {
                    sessionToken = decodeURIComponent(m[1]);
                    try { localStorage.setItem('kakeibo_api_token', sessionToken); } catch (e) { /* ignore */ }
                    history.replaceState(null, '', window.location.pathname + window.location.search);
                }
            } catch (e) { /* ignore */ }
        })();

        function getApiToken_() {
            if (sessionToken) return sessionToken;
            try { return localStorage.getItem('kakeibo_api_token') || ''; } catch (e) { return ''; /* private mode 等 */ }
        }

        function clearApiToken_() {
            sessionToken = '';
            try { localStorage.removeItem('kakeibo_api_token'); } catch (e) { /* ignore */ }
        }

        function promptApiToken_() {
            var input = window.prompt('APIトークンを入力してください（GASのスクリプトプロパティ API_TOKEN と同じ値）');
            if (input && input.trim()) {
                sessionToken = input.trim();
                try { localStorage.setItem('kakeibo_api_token', sessionToken); } catch (e) { /* ignore */ }
                return true;
            }
            return false;
        }

        // 同時に複数のAPIが unauthorized になっても入力ダイアログは1回だけ出し、
        // 全ての呼び出し元が入力完了を待ってからリトライできるようにする
        var tokenPromptPromise = null;
        var tokenPromptDone = false;
        function requestApiToken_() {
            if (tokenPromptDone) return Promise.resolve(false); // 入力済みでも失敗 = トークン不一致。再プロンプトしない
            if (!tokenPromptPromise) {
                tokenPromptPromise = new Promise(function (resolve) {
                    // prompt() はスレッドをブロックするため、先に他の呼び出し元がこの Promise に連なれるよう遅延する
                    setTimeout(function () {
                        var ok = promptApiToken_();
                        tokenPromptDone = true;
                        resolve(ok);
                    }, 0);
                });
            }
            return tokenPromptPromise;
        }

        /**
         * GAS API 共通呼び出しラッパー（リトライ機構付き）
         */
        function callGAS(action, params, retries) {
            if (retries === undefined) retries = 2;
            var body = Object.assign({ action: action, token: getApiToken_() }, params || {});

            return fetch(GAS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(body)
            }).then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            }).then(function (json) {
                if (json && json.error === 'unauthorized') {
                    // トークン未設定/不一致: 一度だけ入力を求め、入力完了を待ってから全呼び出しをリトライ
                    clearApiToken_();
                    return requestApiToken_().then(function (entered) {
                        if (entered) return callGAS(action, params, 0);
                        showToast('APIトークンが未入力または無効です。画面を更新して再入力してください。', true);
                        throw new Error('unauthorized');
                    });
                }
                return json;
            }).catch(function (err) {
                if (retries > 0 && err.message !== 'unauthorized') {
                    var delay = 1000 * (3 - retries);
                    return new Promise(function (resolve) {
                        setTimeout(resolve, delay);
                    }).then(function () {
                        return callGAS(action, params, retries - 1);
                    });
                }
                throw err;
            });
        }

        // ページ読み込み時に設定情報も取得
        if (GAS_API_URL) {
            callGAS('getSettingsData').then(function (res) {
                if (res && res.budget) {
                    currentSettings = res;
                    if (!currentSettings.fixedExpenses) currentSettings.fixedExpenses = [];
                }
                if (res && res.warning) {
                    showToast(res.warning, true);
                }
            }).catch(function (err) {
                console.error('設定情報の取得に失敗:', err);
            });
        }

        /**
         * タブ切替
         */
        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(function (btn) {
                btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
            });
            document.querySelectorAll('.tab-content').forEach(function (content) {
                content.classList.toggle('active', content.id === 'tab-' + tabName);
            });
            if (tabName === 'analysis' && !tabDataLoaded.analysis) {
                loadAnalysisData();
            }
        }

        /**
         * 分析タブのデータを遅延読み込み
         */
        function loadAnalysisData() {
            if (!GAS_API_URL) return;
            showCard('aiAdviceCard');
            var cacheKey = getCacheKey('yearly', currentYear, 0);
            var cached = getCache(cacheKey);
            if (cached) {
                renderYearlyChart(cached);
                tabDataLoaded.analysis = true;
                return;
            }
            callGAS('getYearlyReportData', { year: currentYear })
                .then(function (data) {
                    setCache(cacheKey, data);
                    renderYearlyChart(data);
                    tabDataLoaded.analysis = true;
                })
                .catch(function () { });
        }

        /**
         * データ読み込み（メインエントリポイント）
         */
        function loadData(year, month) {
            document.getElementById('loadingState').style.display = 'flex';
            hideAllCards();
            tabDataLoaded = { home: false, records: false, analysis: false };

            var targetYear = year !== undefined ? year : currentYear;
            var targetMonth = month !== undefined ? month : currentMonth;

            // sessionStorage キャッシュチェック
            var cacheKey = getCacheKey('dashboard', targetYear, targetMonth);
            var cached = getCache(cacheKey);
            if (cached) {
                onDashboardDataLoaded(cached);
                return;
            }

            // ローカルテスト用モックデータ
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                setTimeout(function () {
                    var mockData;
                    if (targetMonth === new Date().getMonth()) {
                        mockData = {
                            monthLabel: targetYear + "年" + (targetMonth + 1) + "月",
                            budget: 150000, totalSpending: 95000, totalIncome: 300000, carryOver: 20000,
                            categories: [
                                { name: "食費", amount: 45000 }, { name: "日用品", amount: 12000 },
                                { name: "交通費", amount: 8000 }, { name: "娯楽", amount: 20000 }, { name: "通信費", amount: 10000 }
                            ],
                            recentRecords: [
                                { date: (targetMonth + 1) + "/05", category: "食費", memo: "スーパー", method: "カード", amount: 5600, type: "支出" },
                                { date: (targetMonth + 1) + "/04", category: "交通費", memo: "チャージ", method: "現金", amount: 3000, type: "支出" },
                                { date: (targetMonth + 1) + "/02", category: "日用品", memo: "ドラッグストア", method: "PayPay", amount: 2800, type: "支出" }
                            ]
                        };
                    } else {
                        mockData = {
                            monthLabel: targetYear + "年" + (targetMonth + 1) + "月",
                            budget: 150000, totalSpending: 148000, totalIncome: 280000, carryOver: -5000,
                            categories: [
                                { name: "食費", amount: 60000 }, { name: "娯楽", amount: 38000 }, { name: "固定費", amount: 50000 }
                            ],
                            recentRecords: [
                                { date: (targetMonth + 1) + "/20", category: "娯楽", memo: "映画", method: "カード", amount: 3800, type: "支出" }
                            ]
                        };
                    }
                    onDashboardDataLoaded(mockData);
                    try {
                        var mockYearlyData = { year: targetYear, monthlyData: [] };
                        var cuml = 100000;
                        for (var m = 1; m <= 12; m++) {
                            var inc = m <= targetMonth + 1 ? 300000 : 0;
                            var exp = m <= targetMonth + 1 ? 250000 + Math.random() * 50000 : 0;
                            var sav = inc - exp;
                            if (m <= targetMonth + 1) cuml += sav;
                            mockYearlyData.monthlyData.push({ month: m, income: inc, expense: exp, savings: sav, cumulativeSavings: cuml });
                        }
                        renderYearlyChart(mockYearlyData);
                    } catch (e) { }
                }, 800);
                return;
            }

            callGAS('getDashboardData', { year: targetYear, month: targetMonth })
                .then(function (data) {
                    setCache(cacheKey, data);
                    onDashboardDataLoaded(data);
                })
                .catch(onError);
        }

        /**
         * ダッシュボードデータ受信後の処理
         */
        function onDashboardDataLoaded(data) {
            document.getElementById('loadingState').style.display = 'none';

            if (data.error) {
                showError(data.error);
                return;
            }

            document.getElementById('monthLabel').textContent = data.monthLabel;

            if (data.totalSpending === 0 && data.totalIncome === 0 && data.recentRecords.length === 0) {
                showCard('emptyState');
                return;
            }

            renderSummary(data);

            // AIアドバイスカード（分析タブ内に常に表示）
            showCard('aiAdviceCard');
            if (data.aiMessage) {
                var cleanMsg = data.aiMessage
                    .replace(/🤖 【AI家計アドバイス】\n\n/, '')
                    .replace(/\n\n※このメッセージはAIが作成しました✨/, '');
                document.getElementById('aiMessageText').textContent = cleanMsg;
            }

            if (data.categories.length > 0) {
                renderPieChart(data.categories);
            }

            // ホームタブ: 直近5件
            if (data.recentRecords.length > 0) {
                renderRecentRecords(data.recentRecords.slice(0, 5));
                renderRecords(data.recentRecords);
            }

            tabDataLoaded.home = true;

            // 分析タブが既にアクティブならデータを読み込む
            if (currentTab === 'analysis' && !tabDataLoaded.analysis) {
                loadAnalysisData();
            }
        }

        /**
         * ホームタブ用: 直近の記録を表示
         */
        function renderRecentRecords(records) {
            var listEl = document.getElementById('recentRecordList');
            listEl.textContent = '';

            records.forEach(function (rec) {
                var icon = CATEGORY_ICONS[rec.category] || '📦';
                var colorIdx = Object.keys(CATEGORY_ICONS).indexOf(rec.category);
                var bgColor = COLORS[colorIdx >= 0 ? colorIdx % COLORS.length : 0];

                var li = document.createElement('li');
                li.className = 'record-item';

                var div = document.createElement('div');
                div.style.cssText = 'display:flex; align-items:center; width:100%; gap:10px;';

                var iconDiv = document.createElement('div');
                iconDiv.className = 'record-icon';
                iconDiv.style.background = bgColor + '22';
                iconDiv.textContent = icon;

                var infoDiv = document.createElement('div');
                infoDiv.className = 'record-info';
                infoDiv.style.cssText = 'flex:1; min-width:0;';

                var memoDiv = document.createElement('div');
                memoDiv.className = 'record-memo';
                memoDiv.textContent = rec.memo;

                var metaDiv = document.createElement('div');
                metaDiv.className = 'record-meta';
                metaDiv.textContent = rec.date + ' · ' + rec.category;

                infoDiv.appendChild(memoDiv);
                infoDiv.appendChild(metaDiv);

                var amountDiv = document.createElement('div');
                amountDiv.className = 'record-amount ' + (rec.type === '収入' ? 'income' : 'expense');
                amountDiv.style.whiteSpace = 'nowrap';
                amountDiv.textContent = (rec.type === '収入' ? '+' : '-') + '¥' + rec.amount.toLocaleString();

                div.appendChild(iconDiv);
                div.appendChild(infoDiv);
                div.appendChild(amountDiv);
                li.appendChild(div);
                listEl.appendChild(li);
            });

            showCard('recentRecordsCard');
        }

        /**
         * 支出サマリーの描画
         */
        function renderSummary(data) {
            var budget = data.budget;
            var spent = data.totalSpending;
            var percent = budget > 0 ? Math.round((spent / budget) * 100) : 0;
            var remain = budget - spent;

            animateNumber('totalSpending', spent);
            document.getElementById('budgetAmount').textContent = budget.toLocaleString();
            document.getElementById('budgetLabel').textContent = budget.toLocaleString();
            document.getElementById('percentUsed').textContent = percent + '%';
            document.getElementById('totalIncome').textContent = '¥' + data.totalIncome.toLocaleString();

            var remainEl = document.getElementById('remainBudget');
            var statusClass = 'safe';

            if (percent > 85) {
                statusClass = 'danger';
            } else if (percent > 60) {
                statusClass = 'warning';
            }

            remainEl.className = 'mini-value ' + statusClass;
            if (remain < 0) {
                statusClass = 'danger';
                remainEl.className = 'mini-value danger';
            }
            remainEl.textContent = '¥' + remain.toLocaleString();

            var fill = document.getElementById('progressFill');
            fill.className = 'progress-fill ' + statusClass;
            setTimeout(function () {
                fill.style.width = Math.min(percent, 100) + '%';
            }, 100);

            // 収支ステータス
            var monthlyBalance = data.totalIncome - data.totalSpending;
            var balanceEl = document.getElementById('monthlyBalance');
            balanceEl.textContent = (monthlyBalance >= 0 ? '+' : '') + '¥' + monthlyBalance.toLocaleString();
            balanceEl.className = 'balance-value ' + (monthlyBalance >= 0 ? 'positive' : 'negative');

            var cumSavings = (data.carryOver || 0) + monthlyBalance;
            var savingsEl = document.getElementById('cumulativeSavings');
            savingsEl.textContent = (cumSavings >= 0 ? '+' : '') + '¥' + cumSavings.toLocaleString();
            savingsEl.className = 'balance-value ' + (cumSavings >= 0 ? 'positive' : 'negative');

            showCard('summaryCard');
        }

        /**
         * トースト通知
         */
        function showToast(message, isError) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(function () {
                toast.className = 'toast';
            }, 3000);
        }

        /**
         * AI分析をリクエストする
         */
        function requestAiAnalysis() {
            var loadingSpan = document.getElementById('aiAnalysisLoading');
            var msgArea = document.getElementById('aiMessageText');

            if (loadingSpan) loadingSpan.style.display = 'inline';
            if (msgArea) msgArea.textContent = '過去のデータや予算設定から、専属アナリストが分析レポートを作成しています... (約10〜20秒かかります)';

            if (!GAS_API_URL && typeof google === 'undefined') {
                setTimeout(function () {
                    if (loadingSpan) loadingSpan.style.display = 'none';
                    msgArea.textContent = "【ローカルデモ分析結果】\n\n・食費が先月比で+15%ペースで進行しています。\n・このペースだと月末に予算を約8,000円超過する見込みです。";
                    showToast('分析が完了しました');
                }, 2000);
                return;
            }

            callGAS('getAiAnalysis', { isWeekly: false })
                .then(function (result) {
                    if (loadingSpan) loadingSpan.style.display = 'none';
                    if (result.success) {
                        try {
                            // LLM(Gemini)出力はサニタイズ必須。DOMPurify 未ロード時はプレーンテキスト表示
                            if (typeof DOMPurify !== 'undefined') {
                                msgArea.innerHTML = DOMPurify.sanitize(marked.parse(result.analysis));
                            } else {
                                msgArea.textContent = result.analysis;
                            }
                        } catch (e) {
                            msgArea.textContent = result.analysis;
                        }
                        msgArea.style.padding = '8px';
                        msgArea.style.color = '#1E293B';
                        showToast('AI分析が完了しました');
                    } else {
                        msgArea.textContent = "エラーが発生しました: " + result.message;
                        showToast(result.message, true);
                    }
                })
                .catch(function (err) {
                    console.error('AI分析の取得に失敗:', err);
                    if (loadingSpan) loadingSpan.style.display = 'none';
                    msgArea.textContent = "通信エラーが発生しました。(" + err.message + ")";
                    showToast('通信エラー', true);
                });
        }

        /**
         * 表示する月を変更する
         */
        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            loadData(currentYear, currentMonth);
        }

        /**
         * 日付入力の表示/非表示
         */
        function toggleDateInput() {
            var row = document.getElementById('dateInputRow');
            var link = document.getElementById('dateToggleLink');
            var isHidden = row.style.display === 'none';
            row.style.display = isHidden ? 'block' : 'none';
            link.textContent = isHidden ? '📅 日付を隠す' : '📅 日付を変更';
        }

        // ===== 初期化 =====
        window.addEventListener('DOMContentLoaded', function () {
            loadData(currentYear, currentMonth);
        });
</script>
